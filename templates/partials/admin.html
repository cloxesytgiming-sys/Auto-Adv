<section class="view" id="view-admin" hidden>
  <header class="page-header">
    <div>
      <h1 class="page-title">Admin Panel</h1>
      <p class="page-sub">Manage keys, users, and monitor the platform.</p>
    </div>
  </header>

  <div class="stat-grid">
    <div class="stat-card"><div class="stat-icon" style="--c:var(--cyan)"><svg class="icon"><use href="#i-users"/></svg></div>
      <div class="stat-body"><div class="stat-label">Users</div><div class="stat-value" id="ao-users">0</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="--c:var(--cyan)"><svg class="icon"><use href="#i-link"/></svg></div>
      <div class="stat-body"><div class="stat-label">Accounts</div><div class="stat-value" id="ao-accounts">0</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="--c:var(--green)"><svg class="icon"><use href="#i-play"/></svg></div>
      <div class="stat-body"><div class="stat-label">Running</div><div class="stat-value" id="ao-running">0</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="--c:var(--magenta)"><svg class="icon"><use href="#i-key"/></svg></div>
      <div class="stat-body"><div class="stat-label">Total Keys</div><div class="stat-value" id="ao-keys">0</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="--c:var(--purple)"><svg class="icon"><use href="#i-key"/></svg></div>
      <div class="stat-body"><div class="stat-label">Active Keys</div><div class="stat-value" id="ao-active-keys">0</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="--c:var(--star)"><svg class="icon"><use href="#i-star"/></svg></div>
      <div class="stat-body"><div class="stat-label">Vouches</div><div class="stat-value" id="ao-vouches">0</div></div></div>
  </div>

  <div class="card">
    <div class="card-title"><svg class="icon"><use href="#i-key"/></svg> Generate Keys</div>
    <div class="row-gap">
      <div style="flex:1;min-width:140px">
        <label>How many?</label>
        <input type="number" id="gen-count" value="1" min="1" max="50">
      </div>
      <div style="flex:1;min-width:140px">
        <label>Max accounts per key</label>
        <input type="number" id="gen-max" value="2" min="1" max="10">
      </div>
      <button class="btn btn-primary" onclick="generateKeys()">Generate</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><svg class="icon"><use href="#i-key"/></svg> All Keys</div>
    <div id="keys-list"></div>
  </div>

  <div class="card">
    <div class="card-title"><svg class="icon"><use href="#i-users"/></svg> Users</div>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Username</th><th>Admin</th><th>Accounts</th><th>Joined</th><th></th></tr></thead>
        <tbody id="users-list"></tbody>
      </table>
    </div>
  </div>
</section>
